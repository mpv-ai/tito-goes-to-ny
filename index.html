<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c1118">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Tito NY">
  <title>Tito Goes to NY — West Village, $2k each</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Outfit:wght@380;500;560&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <div class="brand-kicker">Daily board</div>
        <h1>Tito Goes to NY</h1>
        <p>West Village apartments for 2 or 3 roommates. Max $2k each. Open a card for the listing.</p>
      </div>
      <div class="meta">
        Last sweep: <strong id="updated">—</strong><br>
        Showing <strong id="count">—</strong>
      </div>
    </header>

    <div class="toolbar">
      <div class="chips">
        <button class="chip on" data-filter="all">All</button>
        <button class="chip" data-filter="2">2 bed</button>
        <button class="chip" data-filter="3">3 bed</button>
        <button class="chip" data-filter="west">West Village</button>
        <button class="chip" data-filter="near">Nearby</button>
        <button class="chip" data-filter="saved">Saved</button>
      </div>
      <input class="search" id="search" type="search" placeholder="Search a street" enterkeyhint="search">
      <select id="sort">
        <option value="price">Rent</option>
        <option value="each">Per person</option>
        <option value="beds">Bedrooms</option>
        <option value="name">Name</option>
      </select>
    </div>

    <section class="grid" id="grid"></section>
  </div>

  <div class="drawer-bg" id="shade"></div>
  <aside class="drawer" id="drawer"></aside>

  <script src="listings.js"></script>
  <script src="app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js");
    }
  </script>
</body>
</html>
